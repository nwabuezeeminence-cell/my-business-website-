<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA Signup</title>
<link rel="stylesheet" href="style.css"> <!-- your old css -->
<link rel="stylesheet" href="auth.css"> <!-- NEW auth css -->
</head>
<body class="auth-body">
<div class="auth-container">
  <img src="NEXA.png" width="100" class="auth-logo">
  <h1 class="auth-title">Create NEXA Account</h1>
  
  <input type="text" id="name" placeholder="Full Name" class="auth-input" required>
  <input type="email" id="email" placeholder="Email" class="auth-input" required>
  <input type="password" id="password" placeholder="Password - min 6 chars" class="auth-input" required>
  
  <button onclick="signup()" class="auth-btn">Sign Up</button>
  <p class="auth-link">Already have account? <a href="login.html">Login</a></p>
  <p id="error" class="auth-error"></p>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase.js"></script>

<script>
// SIGNUP FUNCTION
function signup(){
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const error = document.getElementById("error");
  error.innerText = "";

  if(name === "" || email === "" || password === ""){
    error.innerText = "Please fill all fields";
    return;
  }
  if(password.length < 6){
    error.innerText = "Password must be at least 6 characters";
    return;
  }

  auth.createUserWithEmailAndPassword(email, password)
  .then((cred) => {
    // Save user to database so others can see you
    db.ref("users/" + cred.user.uid).set({
      uid: cred.user.uid,
      name: name,
      email: email,
      online: true,
      photo: "NEXA.png",
      createdAt: Date.now()
    });
    // Go to chat page
    window.location.href = "chat.html";
  })
  .catch(err => {
    error.innerText = err.message;
  });
}
</script>
</body>
</html>
