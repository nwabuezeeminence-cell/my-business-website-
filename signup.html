<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | NEXA</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="menu.css">
<link rel="stylesheet" href="auth.css">
<meta name="theme-color" content="#d63384">

<!-- Firebase MUST come first -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
</head>

<body>

<div class="auth-container">
    <div class="logo-area">
        <img src="NEXA.png" class="logo" style="width: 100px; height: 100px;">
        <h1>NEXA</h1>
        <p>Digital Services</p>
    </div>

    <h2>Create Your Account</h2>

    <input type="text" id="signupName" placeholder="Full Name">
    <input type="email" id="signupEmail" placeholder="Email Address"> <!-- Fixed: capital E -->

    <div class="password-box">
        <input type="password" id="signupPassword" placeholder="Password">
        <span class="toggle-password" onclick="toggleSignupPassword()">👁</span>
    </div>

    <div class="password-box">
        <input type="password" id="confirmPassword" placeholder="Confirm Password">
        <span class="toggle-password" onclick="toggleConfirmPassword()">👁</span>
    </div>

    <button onclick="handleSignup()">Signup</button>

    <p class="bottom-text">
        Already Have An Account?
        <a href="login.html">Login</a> <!-- Fixed: lowercase l -->
    </p>
    <p id="errorMsg" style="color:red;text-align:center"></p>
</div>

<script>
function handleSignup() {
    const name = document.getElementById("signupName").value.trim(); // Added this
    const email = document.getElementById("signupEmail").value.trim(); // Fixed ID
    const password = document.getElementById("signupPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const errorMsg = document.getElementById("errorMsg");

    errorMsg.innerText = "";

    if (name === "") {
        errorMsg.innerText = "Please enter your full name.";
        return;
    }
    if (email === "") {
        errorMsg.innerText = "Please enter your email.";
        return;
    }
    if (password.length < 6) {
        errorMsg.innerText = "Password must be at least 6 characters.";
        return;
    }
    if (password !== confirmPassword) {
        errorMsg.innerText = "Passwords do not match.";
        return;
    }

    // Create account in Firebase
    auth.createUserWithEmailAndPassword(email, password)
    .then((userCredential) => {
        const user = userCredential.user;
        // Save user to database
        return db.ref('users/' + user.uid).set({
            name: name,
            email: email,
            createdAt: Date.now()
        });
    })
    .then(() => {
        alert("Account created successfully!");
        window.location.href = "index.html";
    })
    .catch((error) => {
        errorMsg.innerText = error.message;
    });
}

function toggleSignupPassword() {
    const input = document.getElementById("signupPassword");
    input.type = input.type === "password" ? "text" : "password";
}

function toggleConfirmPassword() {
    const input = document.getElementById("confirmPassword");
    input.type = input.type === "password" ? "text" : "password";
}
</script>

<script src="auth.js"></script>
<div id="popupContainer"></div>
<script>
fetch("popup.html")
.then(r=>r.text())
.then(html=>{
    document.getElementById("popupContainer").innerHTML=html;
});
</script>
<link rel="stylesheet" href="popup.css">
<script src="popup.js"></script>
</body>
</html>
