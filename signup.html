<!DOCTYPE html>
<html>
<head>
  <title>Signup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body style="background:#f0f2f5; display:flex; justify-content:center; align-items:center; height:100vh">
  <div class="form-box">
  <img src="NEXA.png" alt="NEXA"> <!-- ADD YOUR LOGO HERE -->
  <h2>NEXA Messenger</h2>
  <h3 style="color:#E94560; margin-bottom:20px; font-size:20px">Create Account</h3>
  
  <input type="email" id="email" placeholder="Email" required>
  
  <div style="position:relative">
    <input type="password" id="password" placeholder="Password" required>
    <span onclick="togglePass('password')">👁️</span>
  </div>

  <div style="position:relative">
    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
    <span onclick="togglePass('confirmPassword')">👁️</span>
  </div>

  <button class="button_1" onclick="signup()">Signup</button>
  <p>Already have account? <a href="login.html">Login</a></p>
</div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="firebase.js"></script>
  <script src="auth.js?v=6"></script> <!-- IMPORTANT: v=6 to bust cache -->
  <script>
    function togglePass(id){
      const x = document.getElementById(id);
      x.type = x.type === "password" ? "text" : "password";
    }
  </script>
</body>
</html>
