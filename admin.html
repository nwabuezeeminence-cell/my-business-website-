<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | NEXA</title>
<link rel="stylesheet" href="style.css?v=5">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body style="background:#0A0A0A; color:var(--text);">

<section class="section">
    <div class="container" style="max-width:1000px; margin:auto;">
        <h2 style="color:var(--nexa); text-align:center;"><i class="fas fa-user-shield"></i> NEXA Admin</h2>

        <!-- STATS CARDS -->
        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:15px; margin:25px 0;">
            <div class="card" style="text-align:center;">
                <h4>Total Users</h4>
                <h2 id="totalUsers">0</h2>
            </div>
            <div class="card" style="text-align:center;">
                <h4>Total Orders</h4>
                <h2 id="totalOrders">0</h2>
            </div>
            <div class="card" style="text-align:center;">
                <h4>Total Notifications</h4>
                <h2 id="totalNotifs">0</h2>
            </div>
        </div>

        <!-- ADMIN TABS -->
        <div style="display:flex; gap:10px; margin-bottom:20px; justify-content:center;">
            <button onclick="showTab('users')" id="btnUsers" class="btn-primary">USERS</button>
            <button onclick="showTab('orders')" id="btnOrders" class="btn-primary" style="opacity:0.6;">ORDERS</button>
            <button onclick="showTab('notifs')" id="btnNotifs" class="btn-primary" style="opacity:0.6;">NOTIFICATIONS</button>
        </div>

        <!-- CONTENT AREAS -->
        <div id="usersTab" class="admin-tab"></div>
        <div id="ordersTab" class="admin-tab" style="display:none;"></div>
        <div id="notifsTab" class="admin-tab" style="display:none;"></div>

    </div>
</section>

<!-- 1. FIREBASE LIBRARIES FIRST -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<!-- 2. YOUR CONFIG SECOND -->
<script src="firebase.js"></script>

<!-- 3. ADMIN PROTECT THIRD -->
<script src="admin-protect.js"></script>

<!-- 4. ADMIN DASHBOARD LAST -->
<script src="admin.js"></script>
</body>
</html>
