<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA Friends</title>
<link rel="stylesheet" href="chat-dark.css?v=6">
<style>
  .page { padding: 20px; padding-bottom: 100px; }
  .title { font-size: 28px; font-weight: 700; color: #8b5cf6; margin-bottom: 20px; }
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .tab { padding: 10px 20px; border-radius: 20px; background: #2a2a2a; color: #aaa; border: none; cursor: pointer; }
  .tab.active { background: #8b5cf6; color: white; }
  .user-card { display: flex; align-items: center; gap: 12px; background: #1f1f1f; padding: 12px; border-radius: 12px; margin-bottom: 10px; }
  .user-card img { width: 45px; height: 45px; border-radius: 50%; background: #333; }
  .user-info { flex: 1; }
  .user-info h4 { margin: 0; color: white; }
  .user-info p { margin: 0; font-size: 12px; color: #888; }
  .user-card button { margin-left: auto; padding: 8px 14px; border: none; border-radius: 8px; background: #8b5cf6; color: white; cursor: pointer; font-weight: 600; }
  .btn-accept { background: #22c55e; }
  .btn-decline { background: #ef4444; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #000; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #222; }
  .nav-item { color: #888; text-align: center; font-size: 12px; cursor: pointer; }
  .nav-item.active { color: #8b5cf6; }
</style>
</head>
<body class="dark">

<div class="page">
    <h1 class="title">👥 Friends</h1>

    <div class="tabs">
        <button class="tab active" onclick="showTab('friends')">My Friends</button>
        <button class="tab" onclick="showTab('requests')">Requests <span id="reqCount"></span></button>
        <button class="tab" onclick="showTab('add')">Add Friend</button>
    </div>

    <input type="text" id="searchFriend" placeholder="Search users..." style="width:100%; padding:12px; border-radius:10px; background:#2a2a2a; border:none; color:white; margin-bottom:15px;">

    <div id="friendsTab"></div>
    <div id="requestsTab" style="display:none;"></div>
    <div id="addTab" style="display:none;"></div>
</div>

<div class="bottom-nav">
    <div class="nav-item" onclick="location='home.html'">🏠<br>Home</div>
    <div class="nav-item active">👥<br>Friends</div>
    <div class="nav-item" onclick="location='chat.html'">💬<br>Chats</div>
    <div class="nav-item" onclick="location='alerts.html'">🔔<br>Alerts</div>
    <div class="nav-item" onclick="location='settings.html'">👤<br>Profile</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script>
let currentUser;
let allUsers = {};
let myFriends = {};
let myRequests = {};

auth.onAuthStateChanged(u => { 
    if(!u) return location='index.html'; 
    currentUser = u; 
    loadData();
});

function showTab(tab){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('#friendsTab, #requestsTab, #addTab').forEach(d=>d.style.display='none');
    if(tab=='friends'){ document.querySelectorAll('.tab')[0].classList.add('active'); friendsTab.style.display='block'; renderFriends(); }
    if(tab=='requests'){ document.querySelectorAll('.tab')[1].classList.add('active'); requestsTab.style.display='block'; renderRequests(); }
    if(tab=='add'){ document.querySelectorAll('.tab')[2].classList.add('active'); addTab.style.display='block'; renderAllUsers(); }
}

// LOAD ALL DATA FROM FIREBASE
function loadData(){
    db.ref('users').on('value', snap => allUsers = snap.val() || {});
    db.ref('friends/' + currentUser.uid).on('value', snap => { myFriends = snap.val() || {}; renderFriends(); });
    db.ref('friendRequests/' + currentUser.uid).on('value', snap => { 
        myRequests = snap.val() || {}; 
        let count = Object.keys(myRequests).length;
        reqCount.innerText = count > 0? `(${count})` : '';
        renderRequests(); 
    });
}

// 1. RENDER MY FRIENDS
function renderFriends(){
    friendsTab.innerHTML = '';
    if(Object.keys(myFriends).length === 0){
        friendsTab.innerHTML = '<p style="text-align:center; color:#777;">No friends yet. Go to "Add Friend"</p>';
        return;
    }
    for(let uid in myFriends){
        let u = allUsers[uid];
        if(!u) continue;
        friendsTab.innerHTML += `
        <div class="user-card">
            <img src="${u.photo || 'NEXA.png'}">
            <div class="user-info">
                <h4>${u.name}</h4>
                <p>${u.email}</p>
            </div>
            <button onclick="startChat('${uid}')">Chat</button>
        </div>`;
    }
}

// 2. RENDER FRIEND REQUESTS
function renderRequests(){
    requestsTab.innerHTML = '';
    if(Object.keys(myRequests).length === 0){
        requestsTab.innerHTML = '<p style="text-align:center; color:#777;">No friend requests</p>';
        return;
    }
    for(let uid in myRequests){
        let u = allUsers[uid];
        if(!u) continue;
        requestsTab.innerHTML += `
        <div class="user-card">
            <img src="${u.photo || 'NEXA.png'}">
            <div class="user-info">
                <h4>${u.name}</h4>
                <p>Sent you a friend request</p>
            </div>
            <button class="btn-accept" onclick="acceptRequest('${uid}')">Accept</button>
            <button class="btn-decline" onclick="declineRequest('${uid}')">Decline</button>
        </div>`;
    }
}

// 3. RENDER ALL USERS TO ADD
function renderAllUsers(){
    addTab.innerHTML = '';
    for(let uid in allUsers){
        if(uid === currentUser.uid) continue; // skip self
        if(myFriends[uid]) continue; // skip friends
        if(myRequests[uid]) continue; // skip if they sent you request
        
        let u = allUsers[uid];
        let sent = myRequests[uid] === 'sent'; // check if you already sent
        
        addTab.innerHTML += `
        <div class="user-card">
            <img src="${u.photo || 'NEXA.png'}">
            <div class="user-info">
                <h4>${u.name}</h4>
                <p>${u.email}</p>
            </div>
            <button onclick="sendRequest('${uid}')" ${sent? 'disabled' : ''}>${sent? 'Sent' : 'Add'}</button>
        </div>`;
    }
}

// 4. SEND FRIEND REQUEST
function sendRequest(uid){
    db.ref('friendRequests/' + uid + '/' + currentUser.uid).set({
        status: 'pending',
        timestamp: Date.now()
    });
    db.ref('friendRequests/' + currentUser.uid + '/' + uid).set('sent'); // mark as sent
    alert('Friend request sent!');
}

// 5. ACCEPT REQUEST
function acceptRequest(uid){
    // Add to both friends lists
    db.ref('friends/' + currentUser.uid + '/' + uid).set(true);
    db.ref('friends/' + uid + '/' + currentUser.uid).set(true);
    // Remove request
    db.ref('friendRequests/' + currentUser.uid + '/' + uid).remove();
    db.ref('friendRequests/' + uid + '/' + currentUser.uid).remove();
    alert('You are now friends!');
}

// 6. DECLINE REQUEST
function declineRequest(uid){
    db.ref('friendRequests/' + currentUser.uid + '/' + uid).remove();
}

// 7. START CHAT
function startChat(uid){
    localStorage.setItem('chatWith', uid);
    location = 'conversation.html';
}

// SEARCH
searchFriend.onkeyup = () => {
    let val = searchFriend.value.toLowerCase();
    document.querySelectorAll('.user-card').forEach(card => {
        card.style.display = card.innerText.toLowerCase().includes(val)? 'flex' : 'none';
    });
}
</script>
</body>
</html>
