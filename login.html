<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | NEXA</title>
<link rel="stylesheet" href="menu.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
<meta name="theme-color" content="#d63384">

<!-- Firebase MUST come before your script -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
</head>

<body>
<div class="auth-container">
    <div class="logo-area">
        <img src="NEXA.png" class="logo" style="width: 100px; height: 100px;">
        <h1>NEXA</h1>
        <p>Digital Services</p>
    </div>

    <h2>Welcome Back 👋</h2>

    <input type="email" id="loginEmail" placeholder="Email Address">

    <div class="password-box">
        <input type="password" id="loginPassword" placeholder="Password">
        <span class="toggle-password" onclick="toggleLoginPassword()">👁</span>
    </div>

    <button onclick="handleLogin()">Login</button>
    <p id="errorMsg" style="color:red;text-align:center;margin-top:10px"></p>

    <a class="forgot-link" href="#" onclick="resetPassword()">Forgot Password?</a>

    <p class="bottom-text">
        Don't have an account?
        <a href="signup.html">Create One</a>
    </p>
</div>

<script>
function handleLogin() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const errorMsg = document.getElementById("errorMsg");
    
    errorMsg.innerText = "";

    if(email === "" || password === ""){
        errorMsg.innerText = "Please fill all fields";
        return;
    }

    // Firebase Login
    auth.signInWithEmailAndPassword(email, password)
    .then(() => {
        alert("Login successful!");
        window.location.href = "index.html"; // redirect to home
    })
    .catch((error) => {
        errorMsg.innerText = error.message;
    });
}

function toggleLoginPassword() {
    const input = document.getElementById("loginPassword");
    input.type = input.type === "password" ? "text" : "password";
}

function resetPassword(){
    const email = document.getElementById("loginEmail").value.trim();
    if(email === ""){
        alert("Please enter your email first");
        return;
    }
    auth.sendPasswordResetEmail(email)
    .then(() => {
        alert("Password reset email sent to " + email);
    })
    .catch((error) => {
        alert(error.message);
    });
}
</script>

<script src="auth.js"></script>
<div id="popupContainer"></div>
<script>
fetch("popup.html")
.then(r=>r.text())
.then(html=>{
    document.getElementById("popupContainer").innerHTML=html;
});
</script>
<link rel="stylesheet" href="popup.css">
<script src="popup.js"></script>
</body>
</html>
