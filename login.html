<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
  <img src="NEXA.png" width="100">
  <h1>NEXA Messenger</h1>
  
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  
  <button onclick="login()">Login</button>
  <p>Don't have account? <a href="signup.html">Sign Up</a></p>
  <p id="error" style="color:red"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase.js"></script>

<script>
function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  
  auth.signInWithEmailAndPassword(email, password)
  .then(() => {
    db.ref("users/" + auth.currentUser.uid).update({online: true});
    window.location.href = "chat.html";
  })
  .catch(err => document.getElementById("error").innerText = err.message);
}
</script>
</body>
</html>
