<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | NEXA</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="community.css">
<style>
.login-wrap{max-width:400px; margin:50px auto; padding:30px 20px; text-align:center;}
.login-wrap img{width:80px; height:80px; border-radius:20px; margin-bottom:10px;}
.login-wrap h1{font-size:28px; color:var(--nexa); margin:0;}
.login-wrap h2{font-size:22px; margin:15px 0 5px 0;}
.login-wrap p{color:var(--gray); margin-bottom:25px;}
.input-group{position:relative; margin-bottom:15px;}
.input-group input{width:100%; padding:14px; background:var(--card); border:1px solid var(--border); border-radius:10px; color:var(--text); outline:none; box-sizing:border-box;}
.input-group i{position:absolute; right:15px; top:50%; transform:translateY(-50%); color:var(--gray); cursor:pointer;}
.btn-nexa{width:100%; margin-top:10px; padding:14px;}
.link{text-align:left; margin-top:10px;}
.link a{font-weight:bold;}
</style>
</head>
<body>
<div class="login-wrap">
    <img src="NEXA.png" alt="NEXA Logo"> <!-- change to your logo -->
    <h1>NEXA</h1>
    <p class="small">Digital Services</p>
    <h2>Welcome Back 👋</h2>

    <div class="input-group">
        <input id="email" type="email" placeholder="Email Address">
    </div>
    <div class="input-group">
        <input id="password" type="password" placeholder="Password">
        <i class="fas fa-eye" onclick="togglePass()"></i>
    </div>

    <button class="btn-nexa" onclick="login()">Login</button>
    
    <div class="link">
        <a href="#" onclick="forgotPass()">Forgot Password?</a>
    </div>
    <p class="small" style="margin-top:20px;">Don't have an account? <a href="signup.html">Create One</a></p>
</div>

<!-- 1. LOAD FIREBASE FIRST -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase.js"></script>

<!-- 2. THEN YOUR AUTH CODE -->
<script src="auth.js"></script>

<!-- 3. POPUP -->
<div id="popupContainer"></div>
<script>
fetch("popup.html").then(r=>r.text()).then(html=>{
    document.getElementById("popupContainer").innerHTML=html;
});
</script>
<link rel="stylesheet" href="popup.css?v=2">
<script src="popup.js"></script>
</body>
</html>
