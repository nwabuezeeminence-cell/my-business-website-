<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA - Welcome</title>
<link rel="stylesheet" href="chat-dark.css">
<style>
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#0a0a0a; color:white; text-align:center; font-family:sans-serif; }
  .logo { width:120px; margin-bottom:20px; border-radius:20px; }
  h1 { color:#8b5cf6; font-size:32px; margin:0; }
  p { color:#aaa; margin-bottom:30px; }
  .btn { width:250px; padding:14px; background:#8b5cf6; color:white; border:none; border-radius:12px; font-size:16px; margin:10px; cursor:pointer; font-weight:600; }
  .btn-outline { background:transparent; border:2px solid #8b5cf6; }
</style>
</head>
<body>
  <img src="img/NEXA.png" class="logo">
  <h1>NEXA</h1>
  <p>Digital Services</p>

  <button class="btn" onclick="location='login.html'">Login</button>
  <button class="btn btn-outline" onclick="location='signup.html'">Create Account</button>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="firebase.js"></script>
<script>
// If user is already logged in, skip this page and go to chat
auth.onAuthStateChanged(user => {
    if(user) window.location.href = 'chat.html';
})
</script>
</body>
</html>
