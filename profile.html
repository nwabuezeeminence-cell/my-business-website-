<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | NEXA</title>
<link rel="stylesheet" href="profile.css?v=5">
</head>
<body>
<div class="profile-page">
    <div class="cover-photo">
        <img id="coverPreview" src="https://via.placeholder.com/800x200/16213E/FFFFFF?text=Cover+Photo">
<img id="profilePreview" src="https://i.imgur.com/6VBx3io.png">
        <label class="edit-cover">
            📷 Change Cover
            <input type="file" id="coverInput" accept="image/*" hidden>
        </label>
    </div>

    <div class="profile-card">
        <div class="profile-image">
            <img id="profilePreview" src="avatar.png">
            <label>
                📷
                <input type="file" id="profileInput" accept="image/*" hidden>
            </label>
        </div>

        <h2 id="fullName">Loading...</h2>
        <p id="username">@username</p>

        <input type="text" id="surname" placeholder="Surname *">
        <input type="text" id="firstname" placeholder="First Name *">
        <input type="text" id="lastname" placeholder="Last Name *">
        <input type="number" id="age" placeholder="Age *" min="10" max="100">
        <label>Date of Birth *</label>
        <input type="date" id="dob">
        <input type="text" id="country" placeholder="Country *" value="Nigeria">
        <input type="text" id="state" placeholder="State of Origin *">
        <textarea id="bio" placeholder="Tell everyone about yourself..."></textarea>

        <button id="saveProfile">Save Profile</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script src="profile.js?v=3"></script>
<script src="app-settings.js"></script>
</body>
</html>
