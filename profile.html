<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Profile - NEXA</title>
  <link rel="stylesheet" href="profile.css?v=1">
</head>
<body>
  <div class="form-box">
    <img class="logo" src="logo.png" alt="NEXA">
    <h2>Complete Your Profile</h2>
    
    <div class="avatar-upload">
      <img id="preview" src="https://i.imgur.com/6VBx3io.png" alt="Profile">
      <input type="file" id="profilePic" accept="image/*">
      <label for="profilePic">Tap to add photo</label>
    </div>

    <input type="text" id="surname" placeholder="Surname *">
    <input type="text" id="firstname" placeholder="First Name *">
    <input type="text" id="middlename" placeholder="Middle Name (Optional)">
    <input type="text" id="lastname" placeholder="Last Name *">
    <input type="number" id="age" placeholder="Age *" min="10" max="100">
    <label>Date of Birth *</label>
    <input type="date" id="dob">
    <input type="text" id="country" placeholder="Country *" value="Nigeria">
    <input type="text" id="state" placeholder="State of Origin *">
    <textarea id="bio" placeholder="More about you..." rows="3"></textarea>
    <button class="button_1" id="continueBtn">Continue</button>
  </div>

<script type="module" src="profile.js?v=1"></script>
</body>
</html>
