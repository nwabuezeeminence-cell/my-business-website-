<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Profile - NEXA</title>
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <div class="form-box">
    <img src="logo.png" alt="NEXA" style="width:100px; margin-bottom:10px;">
    <h2>Complete Your Profile</h2>
    
    <!-- PHOTO UPLOAD AT TOP -->
    <div class="avatar-upload">
      <img id="preview" src="https://i.imgur.com/6VBx3io.png" alt="Profile">
      <input type="file" id="profilePic" accept="image/*">
      <label for="profilePic">Tap to add photo</label>
    </div>

    <input type="text" id="surname" placeholder="Surname *">
    <input type="text" id="firstname" placeholder="First Name *">
    <input type="text" id="middlename" placeholder="Middle Name (Optional)">
    <input type="text" id="lastname" placeholder="Last Name *">
    
    <input type="number" id="age" placeholder="Age *" min="10" max="100">
    
    <label style="text-align:left; font-size:14px; color:#555; margin-top:10px;">Date of Birth *</label>
    <input type="date" id="dob">
    
    <input type="text" id="country" placeholder="Country *" value="Nigeria">
    <input type="text" id="state" placeholder="State of Origin *">
    
    <textarea id="bio" placeholder="More about you..." rows="3"></textarea>

    <button class="button_1" onclick="saveProfile()">Continue</button>
  </div>

<script type="module">
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
  import { app } from './firebase.js';
  
  const auth = getAuth(app);
  const db = getDatabase(app);
  const storage = getStorage(app);
  let currentUser = null;

  onAuthStateChanged(auth, (user) => {
    if(user) currentUser = user;
    else window.location.href = 'login.html';
  });

  // WAIT FOR PAGE TO LOAD FIRST
  document.addEventListener('DOMContentLoaded', () => {
    const fileInput = document.getElementById('profilePic');
    const previewImg = document.getElementById('preview');

    // Preview image immediately after selection
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if(file){
        const reader = new FileReader();
        reader.onload = (event) => {
          previewImg.src = event.target.result; // THIS SHOWS THE IMAGE
        }
        reader.readAsDataURL(file);
      }
    });
  });

  async function saveProfile() {
    const surname = document.getElementById('surname').value;
    const firstname = document.getElementById('firstname').value;
    const middlename = document.getElementById('middlename').value;
    const lastname = document.getElementById('lastname').value;
    const age = document.getElementById('age').value;
    const dob = document.getElementById('dob').value;
    const country = document.getElementById('country').value;
    const state = document.getElementById('state').value;
    const bio = document.getElementById('bio').value;
    const file = document.getElementById('profilePic').files[0];

    if(!surname ||!firstname ||!lastname ||!age ||!dob ||!country ||!state) {
      alert("Please fill all required fields *");
      return;
    }

    let photoURL = document.getElementById('preview').src; // use preview as default
    if(file){
      const storageRef = sRef(storage, 'profiles/' + currentUser.uid + '.jpg');
      await uploadBytes(storageRef, file);
      photoURL = await getDownloadURL(storageRef);
    }

    await set(ref(db, 'users/' + currentUser.uid), {
      surname, firstname, middlename, lastname,
      displayName: `${surname} ${firstname}`,
      age, dob, country, state, bio, photoURL, email: currentUser.email
    });

    alert("Profile saved!");
    window.location.href = 'chat.html';
  }
  window.saveProfile = saveProfile;
</script>
</body>
</html>
