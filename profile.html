<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | NEXA</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1A1A2E; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; }
 .profile-page { width: 100%; min-height: 100vh; }
 .cover-photo { position: relative; width: 100%; height: 200px; background: #16213E; overflow: hidden; }
 .cover-photo img { width: 100%; height: 100%; object-fit: cover; }
 .edit-cover { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; padding: 8px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; }
 .profile-card { background: white; color: #1A1A2E; border-radius: 20px 20px 0 0; margin-top: -20px; padding: 70px 20px 30px 20px; position: relative; min-height: 80vh; }
 .profile-image { position: absolute; top: -60px; left: 50%; transform: translateX(-50%); width: 120px; height: 120px; }
 .profile-image img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid white; background: #eee; }
 .profile-image label { position: absolute; bottom: 5px; right: 5px; background: #E94560; color: white; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid white; font-size: 16px; }
  #fullName { text-align: center; font-size: 24px; font-weight: 800; margin-bottom: 5px; }
  #username { text-align: center; color: #777; margin-bottom: 20px; }
 .profile-card input,.profile-card textarea { width: 100%; padding: 14px; margin: 8px 0; border: 2px solid #EEE; border-radius: 10px; font-size: 16px; color: #1A1A2E; }
 .profile-card label { font-size: 14px; color: #555; margin-top: 5px; display: block; }
  #saveProfile { width: 100%; padding: 16px; background: #E94560; color: white; border: none; border-radius: 10px; font-weight: 800; font-size: 18px; margin-top: 15px; cursor: pointer; }
</style>
</head>
<body>
<div class="profile-page">
    <div class="cover-photo">
        <img id="coverPreview" src="https://via.placeholder.com/800x200/16213E/FFFFFF?text=Cover+Photo">
        <label class="edit-cover">
            📷 Change Cover
            <input type="file" id="coverInput" accept="image/*" hidden>
        </label>
    </div>

    <div class="profile-card">
        <div class="profile-image">
            <img id="profilePreview" src="https://i.imgur.com/6VBx3io.png">
            <label>
                📷
                <input type="file" id="profileInput" accept="image/*" hidden>
            </label>
        </div>

        <h2 id="fullName">Loading...</h2>
        <p id="username">@username</p>

        <input type="text" id="surname" placeholder="Surname *">
        <input type="text" id="firstname" placeholder="First Name *">
        <input type="text" id="lastname" placeholder="Last Name *">
        <input type="number" id="age" placeholder="Age *" min="10" max="100">
        <label>Date of Birth *</label>
        <input type="date" id="dob">
        <input type="text" id="country" placeholder="Country *" value="Nigeria">
        <input type="text" id="state" placeholder="State of Origin *">
        <textarea id="bio" placeholder="Tell everyone about yourself..."></textarea>

        <button id="saveProfile">Save Profile</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase.js"></script>

<script>
const auth = firebase.auth();
const db = firebase.database();
const storage = firebase.storage();
let currentUser = null;
let selectedProfileFile = null;
let selectedCoverFile = null;

auth.onAuthStateChanged(user => {
  if(user){
    currentUser = user;
    document.getElementById('username').innerText = '@' + user.email.split('@')[0];
  } else {
    window.location.href = 'login.html';
  }
});

document.getElementById('profileInput').addEventListener('change', function(e){
  selectedProfileFile = e.target.files[0];
  if(selectedProfileFile){
    const reader = new FileReader();
    reader.onload = (event) => { document.getElementById('profilePreview').src = event.target.result; }
    reader.readAsDataURL(selectedProfileFile);
  }
});

document.getElementById('coverInput').addEventListener('change', function(e){
  selectedCoverFile = e.target.files[0];
  if(selectedCoverFile){
    const reader = new FileReader();
    reader.onload = (event) => { document.getElementById('coverPreview').src = event.target.result; }
    reader.readAsDataURL(selectedCoverFile);
  }
});

document.getElementById('saveProfile').addEventListener('click', async () => {
  const surname = document.getElementById('surname').value;
  const firstname = document.getElementById('firstname').value;
  const lastname = document.getElementById('lastname').value;
  const age = document.getElementById('age').value;
  const dob = document.getElementById('dob').value;
  const country = document.getElementById('country').value;
  const state = document.getElementById('state').value;
  const bio = document.getElementById('bio').value;

  if(!surname ||!firstname ||!lastname ||!age ||!dob ||!country ||
