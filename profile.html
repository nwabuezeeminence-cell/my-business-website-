<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Profile - NEXA</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #1A1A2E; display: flex; justify-content: center; align-items: center;
      font-family: 'Segoe UI', sans-serif;
    }
   .form-box {
      background: white; padding: 30px 25px; width: 100%; max-width: 100%; height: 100%;
      border-radius: 0; box-shadow: none; display: flex; flex-direction: column;
      overflow-y: auto;
    }
    @media (min-width: 600px) {
     .form-box { max-width: 500px; height: auto; border-radius: 20px; margin: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      }
    }
   .form-box img.logo { width: 100px; margin: 0 auto 10px; display:block; }
   .form-box h2 { font-size: 26px; text-align:center; color:#1A1A2E; margin-bottom:20px; }
   .form-box input,.form-box textarea {
      width: 100%; padding: 16px 18px; margin: 10px 0; border: 2px solid #EEE;
      border-radius: 12px; font-size: 17px; box-sizing: border-box;
    }
   .form-box textarea { resize: vertical; }
   .form-box label { text-align:left; font-size:14px; color:#555; margin-top:10px; }
   .button_1 {
      padding: 18px; font-size: 20px; background: #E94560; color:white; border:none;
      border-radius:12px; font-weight:800; margin-top:20px; cursor:pointer;
    }
    
    /* AVATAR STYLES */
   .avatar-upload { text-align: center; margin: 10px 0 25px 0; }
   .avatar-upload img {
      width: 160px; height: 160px; border-radius: 50%; object-fit: cover;
      border: 4px solid #E94560; background: #eee;
    }
   .avatar-upload input[type="file"] { display: none; }
   .avatar-upload label {
      display: block; color: #E94560; font-weight: 700; font-size: 15px;
      cursor: pointer; margin-top: 8px; padding: 8px;
    }
  </style>
</head>
<body>
  <div class="form-box">
    <img class="logo" src="logo.png" alt="NEXA">
    <h2>Complete Your Profile</h2>
    
    <div class="avatar-upload">
      <img id="preview" src="https://i.imgur.com/6VBx3io.png" alt="Profile">
      <input type="file" id="profilePic" accept="image/*">
      <label for="profilePic">Tap to add photo</label>
    </div>

    <input type="text" id="surname" placeholder="Surname *">
    <input type="text" id="firstname" placeholder="First Name *">
    <input type="text" id="middlename" placeholder="Middle Name (Optional)">
    <input type="text" id="lastname" placeholder="Last Name *">
    <input type="number" id="age" placeholder="Age *" min="10" max="100">
    <label>Date of Birth *</label>
    <input type="date" id="dob">
    <input type="text" id="country" placeholder="Country *" value="Nigeria">
    <input type="text" id="state" placeholder="State of Origin *">
    <textarea id="bio" placeholder="More about you..." rows="3"></textarea>
    <button class="button_1" onclick="saveProfile()">Continue</button>
  </div>

<script type="module">
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
  import { app } from './firebase.js';
  
  const auth = getAuth(app);
  const db = getDatabase(app);
  const storage = getStorage(app);
  let currentUser = null;

  onAuthStateChanged(auth, (user) => {
    if(user) currentUser = user;
    else window.location.href = 'login.html';
  });

  const fileInput = document.getElementById('profilePic');
  const previewImg = document.getElementById('preview');

  fileInput.addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) { previewImg.src = e.target.result; }
    reader.readAsDataURL(file);
  });

  async function saveProfile() {
    const surname = document.getElementById('surname').value;
    const firstname = document.getElementById('firstname').value;
    const middlename = document.getElementById('middlename').value;
    const lastname = document.getElementById('lastname').value;
    const age = document.getElementById('age').value;
    const dob = document.getElementById('dob').value;
    const country = document.getElementById('country').value;
    const state = document.getElementById('state').value;
    const bio = document.getElementById('bio').value;
    const file = document.getElementById('profilePic').files[0];

    if(!surname ||!firstname ||!lastname ||!age ||!dob ||!country ||!state) {
      alert("Please fill all required fields *"); return;
    }

    let photoURL = previewImg.src;
    if(file && file.size > 0){
      const storageRef = sRef(storage, 'profiles/' + currentUser.uid + '.jpg');
      await uploadBytes(storageRef, file);
      photoURL = await getDownloadURL(storageRef);
    }

    await set(ref(db, 'users/' + currentUser.uid), {
      surname, firstname, middlename, lastname,
      displayName: `${surname} ${firstname}`,
      age, dob, country, state, bio, photoURL, email: currentUser.email
    });

    alert("Profile saved!");
    window.location.href = 'chat.html';
  }
  window.saveProfile = saveProfile;
</script>
</body>
</html>
