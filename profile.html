<!DOCTYPE html>
<html>
<head>
  <title>Setup Profile</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body style="background:#f0f2f5; display:flex; justify-content:center; align-items:center; height:100vh">
  <div class="form-box">
    <h2>Complete Your Profile</h2>
    <input type="text" id="name" placeholder="Enter your name" required>
    <input type="file" id="photo" accept="image/*" required>
    <textarea id="bio" placeholder="Bio about you"></textarea>
    <button class="button_1" onclick="saveProfile()">Continue</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
  <script src="firebase.js"></script>
  <script src="profile.js"></script>
</body>
</html>
