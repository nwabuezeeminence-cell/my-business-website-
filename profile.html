<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

        <a href="notifications.html" style="position:relative;"><i class="fas fa-bell"></i><span id="notifCount">0</span></a>
        <a href="profile.html"><i class="fas fa-user-circle"></i></a>
    </div>
</header>

<!-- ===== SIDE MENU ===== -->

    <button class="close-btn" onclick="closeMenu()"><i class="fas fa-times"></i></button>
    <a href="index.html"><i class="fas fa-home"></i> Home</a>

<!-- ===== PROFILE ===== -->
<section class="section">
    <div class="container" style="max-width:750px; margin:auto;">
        
        <div class="card" style="padding:0; overflow:hidden;">
            <!-- COVER -->
            <div class="cover-photo" style="position:relative; height:220px; background:#2A2A2A;">
                <img id="coverPreview" src="cover.jpg" style="width:100%; height:100%; object-fit:cover;">
                <label class="edit-cover" style="position:absolute; bottom:10px; right:10px; background:var(--nexa); color:#fff; padding:8px 14px; border-radius:8px; cursor:pointer; font-size:14px;">
                    <i class="fas fa-camera"></i> Change Cover
                    <input type="file" id="coverInput" accept="image/*" hidden>
                </label>
            </div>

            <!-- PROFILE BODY -->
            <div style="padding:25px;">
                <!-- AVATAR -->
                <div class="profile-image" style="position:relative; width:130px; height:130px; margin:-65px auto 15px auto;">
                    <img id="profilePreview" src="avatar.png" style="width:130px; height:130px; border-radius:50%; border:4px solid var(--card); object-fit:cover; background:var(--bg);">
                    <label style="position:absolute; bottom:5px; right:5px; background:var(--nexa); width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff;">
                        <i class="fas fa-camera"></i>
                        <input type="file" id="profileInput" accept="image/*" hidden>
                    </label>
                </div>

                <!-- NAME + STATS -->
                <div style="text-align:center; margin-bottom:20px;">
                    <h2 id="fullName" style="color:var(--text); margin-bottom:5px;">Loading...</h2>
                    <p id="username" style="color:var(--gray); margin-bottom:10px;">@username</p>
                    <p id="email" style="color:var(--gray); font-size:14px;"><i class="fas fa-envelope"></i> loading...</p>
                </div>

                <!-- STATS ROW -->
                <div style="display:flex; justify-content:space-around; text-align:center; margin:20px 0; padding:15px; background:#2A2A2A; border-radius:12px;">
                    <div>
                        <h3 id="orderCount" style="color:var(--nexa); margin:0;">0</h3>
                        <p style="color:var(--gray); font-size:12px; margin:0;">Orders</p>
                    </div>
                    <div>
                        <h3 id="memberSince" style="color:var(--nexa); margin:0;">2026</h3>
                        <p style="color:var(--gray); font-size:12px; margin:0;">Joined</p>
                    </div>
                    <div>
                        <h3 id="accountType" style="color:var(--nexa); margin:0;">Student</h3>
                        <p style="color:var(--gray); font-size:12px; margin:0;">Type</p>
                    </div>
                </div>

                <!-- FORM FIELDS -->
                <div style="display:grid; gap:15px;">
                    <div>
                        <label style="color:var(--text); font-weight:600; display:block; margin-bottom:5px;">Phone Number</label>
                        <input id="phone" type="text" placeholder="+2348012345678" style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:#2A2A2A; color:var(--text);">
                    </div>
                    <div>
                        <label style="color:var(--text); font-weight:600; display:block; margin-bottom:5px;">Location</label>
                        <input id="location" type="text" placeholder="Lagos, Nigeria" style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:#2A2A2A; color:var(--text);">
                    </div>
                    <div>
                        <label style="color:var(--text); font-weight:600; display:block; margin-bottom:5px;">WhatsApp</label>
                        <input id="whatsapp" type="text" placeholder="+2348012345678" style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:#2A2A2A; color:var(--text);">
                    </div>
                    <div>
                        <label style="color:var(--text); font-weight:600; display:block; margin-bottom:5px;">Instagram</label>
                        <input id="instagram" type="text" placeholder="@yourhandle" style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:#2A2A2A; color:var(--text);">
                    </div>
                    <div>
                        <label style="color:var(--text); font-weight:600; display:block; margin-bottom:5px;">About Me</label>
                        <textarea id="bio" placeholder="Tell everyone about yourself..." style="width:100%; min-height:100px; padding:12px; border-radius:10px; border:1px solid var(--border); background:#2A2A2A; color:var(--text); resize:none;"></textarea>
                    </div>
                </div>

                <button id="saveProfile" class="btn-primary" style="margin-top:20px; width:100%;">
                    <i class="fas fa-save"></i> Save Profile
                </button>
            </div>
        </div>

    </div>
</section>

    <div class="container">
        <p>&copy; 2026 NEXA Digital Services. All Rights Reserved.</p>
    </div>

</html>
