<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA Chats</title>
<link rel="stylesheet" href="auth.css?v=3">
<link rel="stylesheet" href="chat.css?v=3">
</head>
<body>
<div class="chat-page">
  <!-- 1. HEADER WITH BACK/HOME BUTTON -->
  <div class="chat-header">
    <button onclick="goHome()" class="back-btn">←</button>
    <div class="header-title">💬 Chats</div>
    <button onclick="searchUsers()" class="search-btn">🔍</button>
  </div>

  <input type="text" id="searchInput" placeholder="Search conversations..." class="search-bar">

  <!-- 2. CONVERSATION LIST -->
  <div id="conversationList" class="conversation-list">
    <!-- If no chats, show this -->
    <div id="emptyState" class="empty-chat">
      <img src="NEXA.png" width="120">
      <h2>No conversations yet</h2>
      <p>Tap the + button below to start your first conversation.</p>
    </div>
  </div>

  <!-- 3. FAB BUTTON -->
  <button class="fab" onclick="showUserList()">+</button>

  <!-- 4. USER LIST POPUP - shows when + is clicked -->
  <div id="userListPanel" class="user-search-panel">
    <div class="panel-header">
      <button onclick="closeUserList()">←</button>
      <h3>Start New Chat</h3>
    </div>
    <input type="text" id="userSearch" placeholder="Search users..." onkeyup="filterUsers()">
    <div id="userList"></div>
    <p id="noUsersMsg" style="display:none; text-align:center; padding:20px; color:#999;">No users found</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script src="chat.js"></script>
</body>
</html>
