<!-- ===== PAGE HEADER ===== -->
<section class="section">
    <div class="container" style="text-align:center;">
        <h2 style="color:var(--nexa); font-size:32px;">Contact Us</h2>
        <p class="subtext">We'd love to hear from you.</p>
    </div>
</section>

<!-- ===== CONTACT FORM ===== -->
<section class="section alt">
    <div class="container" style="max-width:600px; margin:auto;">
        
        <form id="contactForm" class="card" style="text-align:left; padding:30px;">
            <label style="color:var(--text); display:block; margin-bottom:6px;">Full Name</label>
            <input type="text" id="name" required style="width:100%; padding:12px; margin-bottom:15px; border-radius:10px; border:1px solid var(--border); background:#2A2A2A; color:var(--text);">

            <label style="color:var(--text); display:block; margin-bottom:6px;">Email Address</label>
            <input type="email" id="email" required style="width:100%; padding:12px; margin-bottom:15px; border-radius:10px; border:1px solid var(--border); background:#2A2A2A; color:var(--text);">

            <label style="color:var(--text); display:block; margin-bottom:6px;">Subject</label>
            <input type="text" id="subject" required style="width:100%; padding:12px; margin-bottom:15px; border-radius:10px; border:1px solid var(--border); background:#2A2A2A; color:var(--text);">

            <label style="color:var(--text); display:block; margin-bottom:6px;">Message</label>
            <textarea id="message" rows="6" required style="width:100%; padding:12px; margin-bottom:20px; border-radius:10px; border:1px solid var(--border); background:#2A2A2A; color:var(--text);"></textarea>

            <button type="submit" class="btn-primary" style="width:100%;">
                <i class="fas fa-paper-plane"></i> Send Message
            </button>
        </form>

        <div style="text-align:center; margin-top:40px;">
            <h3 style="color:var(--text);">Or contact us directly</h3>
            <p style="color:var(--gray);"><strong>WhatsApp:</strong> +234 702 527 9121</p>
            <a href="https://wa.me/2347025279121" class="btn-primary">
                <i class="fab fa-whatsapp"></i> Chat on WhatsApp
            </a>
        </div>

    </div>
</section>
