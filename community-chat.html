<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GENERAL</title>
<link rel="stylesheet" href="community.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{ --nexa:#E94560; --bg:#0F0F1A; --card:#1A1A2E; --text:#E9EDEF; --gray:#8696A0; }
body{background:var(--bg); color:var(--text); font-family:Arial; margin:0; display:flex; flex-direction:column; height:100vh;}
header{padding:15px; display:flex; align-items:center; gap:10px; background:var(--card);}
.chat-area{flex:1; overflow-y:auto; padding:15px;}
.msg{background:var(--card); padding:10px 12px; border-radius:10px; margin-bottom:10px; max-width:80%;}
.msg b{color:var(--nexa); font-size:13px;}
.msg p{margin:5px 0 0 0;}
.msg small{color:var(--gray); font-size:11px;}
.post-box{display:flex; gap:10px; background:var(--card); padding:10px; position:sticky; bottom:0;}
.post-box input{flex:1; background:transparent; border:none; color:white; outline:none;}
.btn-send{background:var(--nexa); border:none; color:white; padding:10px 14px; border-radius:50%;}
</style>
</head>
<body>

<header>
    <i class="fas fa-arrow-left" onclick="history.back()"></i>
    <h3 style="margin:0;">GENERAL</h3>
</header>

<div class="chat-area" id="chatArea"></div>

<div class="post-box">
    <input id="chatInput" placeholder="Message">
    <button class="btn-send" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase.js"></script> 
<script>
const urlParams = new URLSearchParams(window.location.search);
const communityId = urlParams.get('id');
const dbRef = firebase.database();
let currentUser;

firebase.auth().onAuthStateChanged(user => {
    if(user){ currentUser = user; loadChat(); } else location.href = "login.html";
});

function loadChat(){
    dbRef.ref("communityGeneral/" + communityId).orderByChild("time").on("value", snap => {
        const area = document.getElementById("chatArea");
        area.innerHTML = "";
        snap.forEach(child => {
            const m = child.val();
            area.innerHTML += `<div class="msg"><b>${m.name}</b><p>${m.text}</p><small>${new Date(m.time).toLocaleTimeString()}</small></div>`;
        });
        area.scrollTop = area.scrollHeight;
    });
}

function sendMsg(){
    const text = document.getElementById("chatInput").value.trim();
    if(!text) return;
    dbRef.ref("communityGeneral/" + communityId).push({
        uid: currentUser.uid, name: currentUser.email.split('@')[0], text: text, time: Date.now()
    });
    document.getElementById("chatInput").value = "";
}
</script>
</body>
</html>
